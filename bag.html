<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag — H.O.Y.</title>
<style>
:root{--ink:#1c1c1b;--cream:#f2eee5;--line:rgba(242,238,229,.22)}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
header{height:108px;padding:0 42px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center}.logo img{display:block;height:26px;width:auto}
nav{margin-left:auto;display:flex;gap:22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;align-items:center}
main{min-height:calc(100vh - 108px);display:grid;place-items:center;padding:60px 24px}
.empty{max-width:680px;text-align:center}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:20px}
h1{font-size:clamp(54px,9vw,118px);line-height:.9;margin:0 0 24px;letter-spacing:-.055em}
p{font-size:16px;line-height:1.6;max-width:560px;margin:0 auto 28px;color:rgba(242,238,229,.78)}
.cta{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border:1px solid var(--line);border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:900px){
 header{height:92px;padding:0 24px}
 .logo img{height:22px;width:auto}
 nav{gap:14px}
 nav a:not(.home){display:none}
 main{min-height:calc(100vh - 92px)}
}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><img src="images/hoy-cream-logo.png" alt="H.O.Y."></a>
  <nav>
    <a class="home" href="index.html">Home</a>
    <a href="index.html#collections">Rooms</a>
    <a href="ethos.html">About Us / Ethos</a>
  </nav>
</header>
<main>
  <div class="empty">
    <div class="kicker">Your Bag</div>
    <h1>NOTHING IN HERE. YET.</h1>
    <p>Your bag is ready. Product checkout will be connected here as the H.O.Y. shop goes live.</p>
    <a class="cta" href="index.html#collections">Continue Shopping</a>
  </div>
</main>
</body>
</html>
